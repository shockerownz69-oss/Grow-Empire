<script>

const defaultStats=()=>({plant:0,advance:0,actions:0,harvest:0,sales:0,crosses:0,ounces:0,bestQuality:0,cashPeak:2500,rep:0,eventWins:0,hardHarvest:0,seasonHarvest:0,preserve:0});
function newState(){return{version:1,cash:2500,rep:0,day:1,difficulty:'Grower',screen:'menu',env:{light:55,temp:78,rh:62,co2:800},strains:JSON.parse(JSON.stringify(BASE_STRAINS)),plants:[],inventory:[],facility:1,equipment:0,crew:0,missionClaims:[],stats:defaultStats(),events:[],log:[],settings:{confirmHarvest:true}}}
let S=newState();
function migrate(){if(!S||typeof S!=='object'||Array.isArray(S))S=newState();S.env=S.env||{light:55,temp:78,rh:62,co2:800};S.cash=Number.isFinite(S.cash)?S.cash:2500;S.rep=Number.isFinite(S.rep)?S.rep:0;S.day=Number.isFinite(S.day)?S.day:1;S.difficulty=S.difficulty||'Grower';S.screen=S.screen||'menu';S.strains=S.strains||JSON.parse(JSON.stringify(BASE_STRAINS));S.stats={...defaultStats(),...(S.stats||{})};S.missionClaims=S.missionClaims||[];S.inventory=S.inventory||[];S.plants=S.plants||[];S.events=S.events||[];S.log=S.log||[];S.settings=S.settings||{confirmHarvest:true};}
function save(){try{localStorage.setItem('shockerGrowEmpireSave',JSON.stringify(S));}catch(e){console.warn('Save unavailable',e);}}

function top(){S.stats.cashPeak=Math.max(S.stats.cashPeak,S.cash);S.stats.rep=Math.max(S.stats.rep,S.rep);$('#cashTop').textContent='CASH '+money(S.cash);$('#repTop').textContent='REP '+S.rep;$('#dayTop').textContent='EMPIRE DAY '+S.day;save()}

grow:growView,breeding:breedView,dispensary:dispView,empire:empireView,missions:missionsView,project0:projectView,settings:settingsView};
function growView(){let cap=2+S.facility*2+S.crew;return `<section class="screen"><div class="sectionHead"><div><h2>Grow Room</h2><div class="sub">Capacity ${S.plants.length}/${cap} • Equipment Lv.${S.equipment} • Crew ${S.crew}</div></div><div class="row"><button class="btn primary" onclick="openPlant()">+ Plant Seed</button><button class="btn gold" onclick="advanceDay()">Advance Day</button></div></div><div class="grid g4 hud"><div class="card"><label>LIGHT <span id="lightv">${S.env.light}%</span></label><input id="light" type="range" min="20" max="100" value="${S.env.light}"></div><div class="card"><label>TEMP <span id="tempv">${S.env.temp}°F</span></label><input id="temp" type="range" min="60" max="95" value="${S.env.temp}"></div><div class="card"><label>RH <span id="rhv">${S.env.rh}%</span></label><input id="rh" type="range" min="30" max="85" value="${S.env.rh}"></div><div class="card"><label>CO₂ <span id="co2v">${S.env.co2} PPM</span></label><input id="co2" type="range" min="400" max="1500" step="50" value="${S.env.co2}"></div></div><div class="help">Environment is abstracted for game balance. Healthy targets shift as plants mature; inspect plants for feedback.</div><div class="grid plantgrid" style="margin-top:12px">${S.plants.length?S.plants.map(plantCard).join(''):'<div class="card empty">Your room is empty. Plant genetics from your library to begin.</div>'}</div></section>`}
function plantCard(p){let s=S.strains.find(x=>x.id===p.strainId)||{name:'Custom'};let stage=p.day<10?'Seedling':p.day<25?'Veg':p.day<p.finish?'Flower':'Ready';let art=p.day<10?'🌱':p.day<25?'🌿':'🌳';return `<div class="card plant"><div class="row between"><h3>${s.name}</h3><span class="badge">${stage}</span></div><div class="sub">Day ${p.day}/${p.finish} • Health ${Math.round(p.health)}%</div><div class="plantArt ${p.health<50?'bad':''}">${art}</div><div class="meter">Water <span>${Math.round(p.water)}%</span></div><div class="progress"><i style="width:${p.water}%"></i></div><div class="meter">Nutrition <span>${Math.round(p.nutes)}%</span></div><div class="progress"><i style="width:${p.nutes}%"></i></div><div class="meter">Training <span>${p.training}</span></div><div class="row" style="margin-top:10px"><button class="btn small" onclick="act('${p.id}','water')">Water</button><button class="btn small" onclick="act('${p.id}','feed')">Feed</button><button class="btn small" onclick="act('${p.id}','train')">Train</button><button class="btn small ghost" onclick="inspectPlant('${p.id}')">Inspect</button>${p.day>=p.finish?`<button class="btn small gold" onclick="harvest('${p.id}')">Harvest</button>`:''}</div></div>`}
function openPlant(){let cap=2+S.facility*2+S.crew;if(S.plants.length>=cap)return toast('Facility is at capacity. Expand the empire.');let owned=S.strains.filter(x=>x.unlocked);modal(`<h2>Plant Genetics</h2><p class="sub">Choose genetics for the next slot.</p><select class="select" id="seedSelect">${owned.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="btn primary" onclick="plantSeed()">Plant Seed</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function plantSeed(){let sid=$('#seedSelect').value,s=S.strains.find(x=>x.id===sid);S.plants.push({id:'p'+Date.now(),strainId:sid,day:1,finish:Math.round(45+(100-s.flower)*.38),health:100,water:70,nutes:70,training:0,care:100,events:[]});S.stats.plant++;closeModal();toast(s.name+' planted.');render()}
function act(id,a){let p=S.plants.find(x=>x.id===id);if(!p)return;if(a==='water'){if(p.water>82){p.health-=6;p.care-=5;toast('Overwatered — health took a hit.')}p.water=clamp(p.water+35,0,100)}if(a==='feed'){if(p.nutes>85){p.health-=7;p.care-=6;toast('Nutrient burn — too much feed.')}p.nutes=clamp(p.nutes+30,0,100)}if(a==='train'){if(p.day<7){p.health-=3;toast('Too early to train hard.')}else{p.training++;p.care+=2}}S.stats.actions++;render()}
function envScore(p){let stage=p.day<10?0:p.day<25?1:2,ideal=[[45,77,68,650],[65,78,60,850],[85,77,48,1000]][stage];let vals=[S.env.light,S.env.temp,S.env.rh,S.env.co2],ranges=[55,18,28,650];return clamp(100-vals.reduce((a,v,i)=>a+Math.abs(v-ideal[i])/ranges[i]*35,0),0,100)}
function advanceDay(){if(!S.plants.length)return toast('Plant something first.');S.day++;S.stats.advance++;let diff={Beginner:.65,Grower:1,Master:1.35}[S.difficulty];for(let p of S.plants){p.day++;p.water-=rnd(9,15)*diff;p.nutes-=rnd(5,10)*diff;let es=envScore(p);let penalty=0;if(p.water<25||p.water>95)penalty+=rnd(4,8);if(p.nutes<20||p.nutes>96)penalty+=rnd(3,7);if(es<60)penalty+=(60-es)/8;p.health=clamp(p.health-penalty+((p.water>35&&p.water<85&&p.nutes>30&&es>75)?1.2:0),0,100);p.care=clamp(p.care+(es-75)/25-penalty*.25,0,110);if(Math.random()<.035*diff){let ev=['Spider mites spotted','Magnesium deficiency','Timer failure','Heat spike','Root-zone stress'][rnd(0,4)];p.events.push(ev);p.health-=rnd(3,8);toast('Random event: '+ev)}}render()}
function inspectPlant(id){let p=S.plants.find(x=>x.id===id),s=S.strains.find(x=>x.id===p.strainId),es=Math.round(envScore(p));let tips=[];if(p.water<35)tips.push('Water is low.');if(p.water>88)tips.push('Root zone is too wet.');if(p.nutes<30)tips.push('Nutrition is running low.');if(es<70)tips.push('Environment is outside the plant’s sweet spot.');if(!tips.length)tips.push('Plant is responding well. Stay consistent.');modal(`<h2>${s.name}</h2><div class="grid g2"><div class="card"><div class="sub">HEALTH</div><div class="statbig">${Math.round(p.health)}%</div></div><div class="card"><div class="sub">ENVIRONMENT FIT</div><div class="statbig">${es}%</div></div></div><h3 style="margin-top:14px">Grow Notes</h3><p class="sub">${tips.join(' ')} ${p.events.length?'Events: '+p.events.slice(-3).join(', ')+'.':''}</p><button class="btn" onclick="closeModal()">Back to Room</button>`)}
function harvest(id){let p=S.plants.find(x=>x.id===id),s=S.strains.find(x=>x.id===p.strainId);let q=clamp(Math.round(p.health*.38+p.care*.27+s.stability*.13+s.potency*.1+s.terps*.12+S.equipment*1.5+S.crew*.6-rnd(0,5)),20,100);let oz=Math.max(.5,Math.round(((s.yield/100)*2.2*(.65+p.health/170)*(1+p.training*.035)*(1+S.equipment*.04))*10)/10);S.inventory.push({id:'h'+Date.now(),strain:s.name,quality:q,oz,kind:'Flower',base:120+q*3});S.plants=S.plants.filter(x=>x.id!==id);S.stats.harvest++;S.stats.ounces+=oz;S.stats.bestQuality=Math.max(S.stats.bestQuality,q);S.stats.seasonHarvest++;if(s.tags.includes('Preservation'))S.stats.preserve++;if(S.difficulty==='Master'&&q>=90)S.stats.hardHarvest=90;toast(`Harvested ${oz} oz • Quality ${q}`);render()}
function breedView(){let o=S.strains.filter(x=>x.unlocked);return `<section class="screen"><h2>Breeding Lab</h2><p class="sub">Pair owned genetics. Offspring inherit blended traits with controlled variation.</p><div class="grid g2"><div class="card"><h3>Parent A</h3><select class="select" id="pa">${o.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div><div class="card"><h3>Parent B</h3><select class="select" id="pb">${o.map((x,i)=>`<option ${i===1?'selected':''} value="${x.id}">${x.name}</option>`).join('')}</select></div></div><div id="offspring" class="card" style="margin-top:12px"></div><div class="row" style="margin-top:12px"><input id="crossName" class="select" style="max-width:360px" placeholder="Name your cross"><button class="btn primary" onclick="createCross()">Create Cross • $750</button></div></section>`}
function previewCross(){let a=S.strains.find(x=>x.id===$('#pa')?.value),b=S.strains.find(x=>x.id===$('#pb')?.value),e=$('#offspring');if(!a||!b||!e)return;let avg=k=>Math.round((a[k]+b[k])/2);let traits=[];if(avg('potency')>91)traits.push('High Resin');if([...a.tags,...b.tags].some(x=>/Gas|Fuel|Diesel|Chem/.test(x)))traits.push('Gas');if(avg('yield')>86)traits.push('Yield');if([...a.tags,...b.tags].some(x=>/Color|Purple|Red/.test(x)))traits.push('Color');if(avg('stability')>90)traits.push('Stability');e.innerHTML=`<h3>Projected Offspring</h3><div class="tags">${traits.map(x=>`<span class="tagchip">${x}</span>`).join('')||'<span class="tagchip">Balanced</span>'}</div>${bar('Yield',avg('yield'))}${bar('Potency',avg('potency'))}${bar('Terpenes',avg('terps'))}${bar('Flower',avg('flower'))}${bar('Stability',avg('stability'))}`}
function createCross(){if(S.cash<750)return toast('Need $750 to run the breeding program.');let a=S.strains.find(x=>x.id===$('#pa').value),b=S.strains.find(x=>x.id===$('#pb').value);if(a.id===b.id)return toast('Choose two different parents.');let name=$('#crossName').value.trim()||`${a.name.split(' ')[0]} × ${b.name.split(' ')[0]}`;let mix=k=>clamp(Math.round((a[k]+b[k])/2+rnd(-6,6)),40,100);let tags=[...new Set([...a.tags,...b.tags])].sort(()=>Math.random()-.5).slice(0,3);S.strains.push({id:'c'+Date.now(),name,yield:mix('yield'),potency:mix('potency'),terps:mix('terps'),flower:mix('flower'),stability:mix('stability'),tags,unlocked:true,custom:true});S.cash-=750;S.stats.crosses++;toast(name+' added to the genetics vault.');render()}
let dispTab='Flower';function dispView(){let inv=S.inventory.filter(x=>x.kind===dispTab);return `<section class="screen"><h2>Dispensary</h2><p class="sub">Move finished inventory. Better quality and reputation command stronger prices.</p><div class="tabs">${['Flower','Concentrates','Edibles'].map(x=>`<button class="btn small ${dispTab===x?'active':''}" onclick="setDisp('${x}')">${x}</button>`).join('')}</div>${dispTab!=='Flower'?`<div class="card"><h3>${dispTab} Production</h3><p class="sub">Convert premium flower inventory into higher-value ${dispTab.toLowerCase()} lots.</p><button class="btn" onclick="processProduct('${dispTab}')">Process Best Flower • $300</button></div>`:''}<div class="grid g2" style="margin-top:12px">${inv.length?inv.map(i=>{let price=Math.round(i.base*(1+S.rep/1500));return `<div class="card inventoryItem"><div class="row between"><h3>${i.strain}</h3><div class="quality">${i.quality}</div></div><div class="sub">${i.kind} • ${i.oz} ${i.kind==='Flower'?'oz':'units'} • Quality ${i.quality}/100</div><div class="row between"><b>${i.kind==='Flower'?money(price)+'/oz':money(price)+' lot'}</b><button class="btn primary" onclick="sellLot('${i.id}')">Sell</button></div></div>`}).join(''):'<div class="card empty">No inventory in this category.</div>'}</div></section>`}
function setDisp(x){dispTab=x;render()}function sellLot(id){let i=S.inventory.find(x=>x.id===id),price=Math.round(i.base*(1+S.rep/1500)),total=i.kind==='Flower'?price*i.oz:price;S.cash+=total;S.rep+=Math.max(1,Math.round(i.quality/12));S.stats.sales++;S.inventory=S.inventory.filter(x=>x.id!==id);toast(`Sold for ${money(total)}.`);render()}
function processProduct(kind){let flowers=S.inventory.filter(x=>x.kind==='Flower').sort((a,b)=>b.quality-a.quality);if(!flowers.length)return toast('No flower inventory to process.');if(S.cash<300)return toast('Need $300 processing cost.');let f=flowers[0];S.cash-=300;S.inventory=S.inventory.filter(x=>x.id!==f.id);let mult=kind==='Concentrates'?1.9:1.45;S.inventory.push({id:'h'+Date.now(),strain:f.strain,quality:clamp(f.quality+rnd(-2,4),0,100),oz:Math.max(1,Math.round(f.oz*4)),kind,base:Math.round(f.base*mult)});toast(kind+' batch finished.');render()}
function empireView(){let fc=2500*S.facility,ec=1800*(S.equipment+1),cc=1400*(S.crew+1);return `<section class="screen"><h2>Empire</h2><div class="grid g3"><div class="card"><h3>Expand Facilities</h3><div class="statbig">Tier ${S.facility}</div><p class="sub">Adds two plant slots per tier.</p><button class="btn primary" onclick="buy('facility',${fc})">Upgrade • ${money(fc)}</button></div><div class="card"><h3>Upgrade Equipment</h3><div class="statbig">Level ${S.equipment}</div><p class="sub">Improves final harvest quality and consistency.</p><button class="btn primary" onclick="buy('equipment',${ec})">Upgrade • ${money(ec)}</button></div><div class="card"><h3>Hire Crew</h3><div class="statbig">${S.crew} Growers</div><p class="sub">Adds capacity and a small quality bonus.</p><button class="btn primary" onclick="buy('crew',${cc})">Hire • ${money(cc)}</button></div></div><div class="sectionHead"><div><h2>Grow Events</h2><div class="sub">Enter a finished flower lot against AI growers.</div></div><button class="btn gold" onclick="enterEvent()">Compete • $500</button></div>${S.events.length?`<div class="card eventboard">${S.events.slice(-5).reverse().map(e=>`<div><h3>${e.name} ${e.win?'🏆':''}</h3>${e.board.map((x,i)=>`<div class="leader"><b>${i+1}</b><span>${x.name}</span><b>${x.score}</b></div>`).join('')}</div>`).join('')}</div>`:'<div class="card empty">No event history yet.</div>'}</section>`}
function buy(k,c){if(S.cash<c)return toast('Not enough cash.');S.cash-=c;S[k]++;toast(k+' upgraded.');render()}
function enterEvent(){let flower=S.inventory.filter(x=>x.kind==='Flower').sort((a,b)=>b.quality-a.quality)[0];if(!flower)return toast('You need a flower harvest lot to enter.');if(S.cash<500)return toast('Need $500 entry fee.');S.cash-=500;let score=clamp(flower.quality+Math.round(S.rep/100)+rnd(-3,4),1,110);let names=['Midwest Melt','Red Beard','Vault Crew','Night Garden','Concrete Roots','Old Head Genetics'];let board=names.slice(0,5).map(n=>({name:n,score:rnd(72,103)}));board.push({name:'Shocker OwnZ',score});board.sort((a,b)=>b.score-a.score);let win=board[0].name==='Shocker OwnZ';if(win){S.cash+=5000;S.rep+=60;S.stats.eventWins++;}else S.rep+=10;S.events.push({name:'Crown Cup • Day '+S.day,board,win});toast(win?'CROWN CUP WIN — $5,000 + 60 REP':'Event complete. Keep hunting the crown.');render()}
function missionProgress(m){let v=S.stats[m.type]||0;if(m.type==='facility')v=S.facility;if(m.type==='rep')v=S.rep;if(m.type==='cashPeak')v=S.stats.cashPeak;if(m.type==='quality'&&m.strain){v=S.inventory.filter(x=>x.strain===m.strain).reduce((a,x)=>Math.max(a,x.quality),0);if(v<m.target&&S.log.some(x=>x.strain===m.strain&&x.quality>=m.target))v=m.target}return v}
function missionsView(){return `<section class="screen"><h2>Mission Log</h2><p class="sub">${MISSION_TEMPLATES.length} missions across tutorials, trials, yield, quality, empire, breeding, mastery, events, hard mode, seasonal and preservation challenges.</p><div class="grid g2">${MISSION_TEMPLATES.map(m=>{let v=missionProgress(m),done=v>=m.target,claimed=S.missionClaims.includes(m.id);return `<div class="card mission ${claimed?'done':''}"><div class="row between"><span class="badge">${m.cat}</span><b>${Math.min(v,m.target)}/${m.target}</b></div><h3>${m.name}</h3><div class="sub">${m.detail}</div><div class="progress"><i style="width:${clamp(v/m.target*100,0,100)}%"></i></div><div class="row between"><span class="sub">Reward: ${money(m.reward.cash)} • ${m.reward.rep} REP</span>${done&&!claimed?`<button class="btn small gold" onclick="claimMission('${m.id}')">Claim</button>`:claimed?'<span class="status good">CLAIMED</span>':'<span class="status warn">ACTIVE</span>'}</div></div>`}).join('')}</div></section>`}
function claimMission(id){let m=MISSION_TEMPLATES.find(x=>x.id===id);if(!m||missionProgress(m)<m.target||S.missionClaims.includes(id))return;S.cash+=m.reward.cash;S.rep+=m.reward.rep;S.missionClaims.push(id);toast('Mission reward claimed.');render()}
function projectView(){let vals=['Genetics','No Compromise','Preservation','Cultivation','Family','Freedom','Resin','Knowledge'];let lvl=Math.min(8,Math.floor((S.stats.harvest+S.stats.crosses+S.stats.preserve+S.rep/50)/3));return `<section class="screen"><div style="text-align:center"><div class="crown">0</div><h2>Project 0</h2><div class="bigquote">“IT'S NEVER ABOUT THE MONEY.”</div><p class="sub">Preserve expression. Document the work. Protect the genetics. Pass the knowledge forward.</p></div><div class="projectTrack" style="margin-top:20px">${vals.map((v,i)=>`<div class="node ${i<lvl?'on':''}">${i<lvl?'♛<br>':''}${v}</div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Preservation Progress</h3><div class="progress"><i style="width:${lvl/8*100}%"></i></div><p class="sub">Harvest preservation-tagged genetics, create crosses, finish missions and build reputation to advance the Project 0 track.</p><div class="row"><span class="pill">Preservation Harvests ${S.stats.preserve}</span><span class="pill">Crosses ${S.stats.crosses}</span><span class="pill">Knowledge: ${S.missionClaims.length} missions claimed</span></div></div></section>`}
function settingsView(){return `<section class="screen settings"><h2>Settings & Saves</h2><div class="card"><label>Difficulty</label><select id="difficulty" class="select"><option ${S.difficulty==='Beginner'?'selected':''}>Beginner</option><option ${S.difficulty==='Grower'?'selected':''}>Grower</option><option ${S.difficulty==='Master'?'selected':''}>Master</option></select><p class="help">Beginner reduces daily stress. Grower is balanced. Master amplifies mistakes and random events.</p><label>Save Management</label><div class="row"><button class="btn" onclick="exportSave()">Export JSON</button><button class="btn" onclick="$('#importFile').click()">Import JSON</button><input class="file" id="importFile" type="file" accept="application/json"><button class="btn ghost" onclick="manualSave()">Save Now</button><button class="btn" onclick="resetGame()">New Empire</button></div><p class="help">The game auto-saves locally after state changes. Export a JSON backup before clearing browser data.</p></div><div class="card" style="margin-top:12px"><h3>About</h3><p class="sub">Shocker OwnZ Grow Empire is a fictional strategy simulator. Its environmental model is intentionally game-like rather than a real-world cultivation guide.</p></div></section>`}
function bind(){['light','temp','rh','co2'].forEach(k=>{let e=$('#'+k);if(e)e.oninput=()=>{S.env[k]=+e.value;$('#'+k+'v').textContent=e.value+(k==='temp'?'°F':k==='co2'?' PPM':'%');save()}});if(S.screen==='breeding'){previewCross();$('#pa').onchange=previewCross;$('#pb').onchange=previewCross}let d=$('#difficulty');if(d)d.onchange=()=>{S.difficulty=d.value;save();toast('Difficulty set to '+d.value)};let f=$('#importFile');if(f)f.onchange=importSave;}
function modal(html){$('#modal').innerHTML=`<div class="card modalbox">${html}</div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function manualSave(){save();toast('Empire saved locally.')}function exportSave(){save();let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shocker-ownz-grow-empire-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);migrate();save();toast('Save imported.');go('menu')}catch{toast('That save file is not valid JSON.')}};r.readAsText(f)}function resetGame(){if(confirm('Erase the local empire and start over?')){S=newState();save();render()}}
// Keep a compact harvest history so strain-trial missions remain claimable after selling inventory.
const oldHarvest=harvest;harvest=function(id){let p=S.plants.find(x=>x.id===id),s=p&&S.strains.find(x=>x.id===p.strainId);oldHarvest(id);let last=S.inventory[S.inventory.length-1];if(last&&s){S.log.push({strain:s.name,quality:last.quality});save()}}
function boot(){const splash=document.getElementById('splash'),game=document.getElementById('game');try{try{var raw=localStorage.getItem('shockerGrowEmpireSave');if(raw){var loaded=JSON.parse(raw);if(loaded&&typeof loaded==='object'&&!Array.isArray(loaded))S=loaded;}}catch(storageErr){console.warn('Starting fresh',storageErr);S=newState();}migrate();if(splash)splash.classList.add('hidden');if(game)game.classList.remove('hidden');render()}catch(err){console.error(err);if(splash)splash.classList.add('hidden');if(game)game.classList.remove('hidden');const app=document.getElementById('app');if(app)app.innerHTML='<section class="screen"><div class="card"><h2>Grow Empire Recovery</h2><p class="sub">The game hit a startup error. Tap the button below to repair the local save and restart.</p><button class="btn primary" id="repairBtn">Repair & Restart</button><p class="help">Error: '+String(err.message||err)+'</p></div></section>';const b=document.getElementById('repairBtn');if(b)b.onclick=()=>{localStorage.removeItem('shockerGrowEmpireSave');location.reload()}}}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot,{once:true})}else{boot()}window.addEventListener('load',()=>setTimeout(boot,50),{once:true});setTimeout(()=>{if(document.getElementById('splash')&&!document.getElementById('splash').classList.contains('hidden'))boot()},3000);
</script>
</body></html>
