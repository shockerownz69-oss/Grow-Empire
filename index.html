<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Shocker OwnZ Grow Empire</title>
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 34'%3E%3Cpath d='M4 10l7 5.5L24 6l13 9.5L44 10 40.5 28h-33z' fill='%23e02020'/%3E%3Crect x='7.5' y='29' width='33' height='3' rx='1.5' fill='%23e02020'/%3E%3C/svg%3E">
</head>
<body>
<header id="hud" class="hidden">
  <div class="hud-brand"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><g fill="#e02020" stroke="none"><path d="M2.5 9l4.3 3.4L12 5.5l5.2 6.9L21.5 9 19.3 19H4.7z"/><rect x="4.7" y="20" width="14.6" height="2.2" rx="1"/><circle cx="2.5" cy="8" r="1.6"/><circle cx="12" cy="4.5" r="1.6"/><circle cx="21.5" cy="8" r="1.6"/></g></svg></div>
  <div class="hud-stats">
    <div class="hud-stat"><span class="hud-label">CASH</span><span id="hud-cash" class="hud-val">$0</span></div>
    <div class="hud-stat"><span class="hud-label">REP</span><span id="hud-rep" class="hud-val">0</span></div>
    <div class="hud-stat"><span class="hud-label">LVL</span><span id="hud-level" class="hud-val">1</span></div>
    <div class="hud-stat"><span class="hud-label">DAY</span><span id="hud-day" class="hud-val">1</span></div>
  </div>
</header>

<main id="app">
  <!-- SPLASH -->
  <section id="scr-splash" class="screen">
    <div class="splash-wrap">
      <div class="splash-emblem"><svg class="gasmask-svg splash-mask" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="sgmz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#7a0d0d"/></radialGradient></defs><path d="M32 5C20.5 5 13 13.5 13 26c0 7.8 3.8 14 9.6 17.4L25.5 51h13l2.9-7.6C47.2 40 51 33.8 51 26 51 13.5 43.5 5 32 5z" fill="#161616" stroke="#e02020" stroke-width="2"/><circle cx="23.5" cy="26" r="7" fill="#050505" stroke="#333" stroke-width="1.5"/><circle cx="40.5" cy="26" r="7" fill="#050505" stroke="#333" stroke-width="1.5"/><circle cx="23.5" cy="26" r="3.4" fill="url(#sgmz)"/><circle cx="40.5" cy="26" r="3.4" fill="url(#sgmz)"/><rect x="27" y="35" width="10" height="8" rx="3" fill="#0a0a0a" stroke="#444"/><path d="M15 13l5 3.5M49 13l-5 3.5" stroke="#e02020" stroke-width="2.5"/></svg></div>
      <div class="splash-crown"><svg class="crown-svg" viewBox="0 0 48 34" aria-hidden="true"><defs><linearGradient id="scrw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#e02020"/></linearGradient></defs><path d="M4 10l7 5.5L24 6l13 9.5L44 10 40.5 28h-33z" fill="url(#scrw)" stroke="#000" stroke-width="1"/><rect x="7.5" y="29" width="33" height="3" rx="1.5" fill="#e02020"/><circle cx="4" cy="9" r="2.4" fill="#e02020"/><circle cx="24" cy="5" r="2.4" fill="#e02020"/><circle cx="44" cy="9" r="2.4" fill="#e02020"/></svg></div>
      <h1 class="logo-text display">SHOCKER OWNZ<br><span class="logo-sub">GROW EMPIRE</span></h1>
      <p class="tagline">PLANT &bull; GROW &bull; BREED &bull; HARVEST &bull; BUILD</p>
      <p class="tagline dim">REAL GENETICS &bull; REAL GROWS &bull; REAL KNOWLEDGE</p>
      <button id="btn-enter" class="btn btn-primary btn-big">ENTER THE EMPIRE</button>
    </div>
  </section>

  <!-- DIFFICULTY / NEW GAME -->
  <section id="scr-difficulty" class="screen hidden">
    <div class="panel">
      <h2><svg class="ic sh-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="#e02020" stroke="none"><path d="M2.5 9l4.3 3.4L12 5.5l5.2 6.9L21.5 9 19.3 19H4.7z"/><rect x="4.7" y="20" width="14.6" height="2.2" rx="1"/><circle cx="2.5" cy="8" r="1.6"/><circle cx="12" cy="4.5" r="1.6"/><circle cx="21.5" cy="8" r="1.6"/></g></svg>START YOUR EMPIRE</h2>
      <p class="muted">Choose your difficulty. This affects pests, environment tolerance, economy and rewards.</p>
      <div id="diff-list"></div>
    </div>
  </section>

  <!-- MAIN MENU (hero rendered by JS into #menu-buttons) -->
  <section id="scr-menu" class="screen hidden">
    <div id="menu-buttons"></div>
  </section>

  <!-- GAME SCREENS (rendered by JS) -->
  <section id="scr-grow" class="screen hidden"><div id="grow-root"></div></section>
  <section id="scr-grows" class="screen hidden"><div id="grows-root"></div></section>
  <section id="scr-genetics" class="screen hidden"><div id="genetics-root"></div></section>
  <section id="scr-dispensary" class="screen hidden"><div id="dispensary-root"></div></section>
  <section id="scr-breeding" class="screen hidden"><div id="breeding-root"></div></section>
  <section id="scr-project0" class="screen hidden"><div id="project0-root"></div></section>
  <section id="scr-empire" class="screen hidden"><div id="empire-root"></div></section>
  <section id="scr-missions" class="screen hidden"><div id="missions-root"></div></section>
  <section id="scr-keepers" class="screen hidden"><div id="keepers-root"></div></section>
  <section id="scr-home" class="screen hidden"><div id="home-root"></div></section>
  <section id="scr-challenges" class="screen hidden"><div id="challenges-root"></div></section>
  <section id="scr-achievements" class="screen hidden"><div id="achievements-root"></div></section>
  <section id="scr-leaderboards" class="screen hidden"><div id="leaderboards-root"></div></section>
  <section id="scr-locations" class="screen hidden"><div id="locations-root"></div></section>
  <section id="scr-settings" class="screen hidden"><div id="settings-root"></div></section>
</main>

<nav id="bottomnav" class="hidden">
  <button data-nav="menu"><svg class="ic nav-ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><path d="M2.5 9l4.3 3.4L12 5.5l5.2 6.9L21.5 9 19.3 19H4.7z"/><rect x="4.7" y="20" width="14.6" height="2.2" rx="1"/></g></svg><span>Menu</span></button>
  <button data-nav="grow"><svg class="ic nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-3.6 2.8-6.5 7.5-6.5 0 3.6-2.8 6.5-7.5 6.5z"/><path d="M12 13c0-3.6-2.8-6.5-7.5-6.5 0 3.6 2.8 6.5 7.5 6.5z"/><path d="M5 21h14"/></svg><span>Grow</span></button>
  <button data-nav="genetics"><svg class="ic nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3c0 5.5 10 5.5 10 11s-10 5.5-10 7"/><path d="M17 3c0 5.5-10 5.5-10 11s10 5.5 10 7"/><path d="M8.6 6.8h6.8M8.6 17.2h6.8M7.9 12h8.2"/></svg><span>Genetics</span></button>
  <button data-nav="dispensary"><svg class="ic nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5V20h16v-9.5"/><path d="M2.8 10.5L4.3 4h15.4l1.5 6.5"/><path d="M2.8 10.5h18.4"/><path d="M10 20v-5.5h4V20"/></svg><span>Shop</span></button>
  <button data-nav="missions"><svg class="ic nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12V21l-3-2.2-3 2.2-3-2.2-3 2.2z"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg><span>Missions</span></button>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="import-file" accept="application/json" class="hidden">

<script src="./game.js"></script>
</body>
</html>
